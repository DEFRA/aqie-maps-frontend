# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_aqie-maps-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/aqie-maps-frontend
sonar.links.ci=https://github.com/DEFRA/aqie-maps-frontend/actions
sonar.links.scm=https://github.com/DEFRA/aqie-maps-frontend
sonar.links.issue=https://github.com/DEFRA/aqie-maps-frontend/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js

# DAQI colours are legally defined, so their text/background contrast cannot be changed
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.e1.resourceKey=src/client/stylesheets/components/_daqi.scss
